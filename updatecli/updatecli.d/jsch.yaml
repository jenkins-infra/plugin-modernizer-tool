name: Update jsch plugin version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  latestJschVersion:
    kind: githubrelease
    spec:
      owner: "jenkinsci"
      repository: "jsch-plugin"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versioning:
        kind: semver
        pattern: "latest"

targets:
  updateRecipesYaml:
    name: "Update jsch plugin version in recipes.yml"
    kind: file
    spec:
      file: ./plugin-modernizer-core/src/main/resources/META-INF/rewrite/recipes.yml
      matchPattern: "(pluginArtifactId: jsch\\n)(.*pluginVersion:) .*"
      replacePattern: '$1$2$3 {{ source "latestJschVersion" }}'
    sourceid: latestJschVersion
    scmid: default
  updateVersions:
    name: "Update jsch plugin version in versions.properties"
    kind: file
    spec:
      file: ./plugin-modernizer-core/src/main/resources/versions.properties
      matchPattern: "(?m)^(jsch.version =) (.*)"
      replacePattern: '$1 {{ source "latestJschVersion" }}'
    sourceid: latestJschVersion
    scmid: default

actions:
  createPullRequest:
    kind: github/pullrequest
    scmid: default
    title: 'Update jsch plugin version to {{ source "latestJschVersion" }}'
    spec:
      labels:
        - dependencies
        - updatecli
