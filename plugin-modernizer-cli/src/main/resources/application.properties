quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# Keep Quarkus startup and shutdown logs out of the CLI output
quarkus.banner.enabled=false
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."io.smallrye".level=WARN
quarkus.log.category."org.jboss".level=WARN

# DEBUG root level so the log files keep full details
quarkus.log.level=DEBUG
quarkus.log.min-level=TRACE
quarkus.log.category."io.jenkins.tools.pluginmodernizer".level=TRACE

# Integration test assertions rely on the trailing space after each message
# Level (INFO, or DEBUG with --debug) and plugin markers are filtered by console-filter
quarkus.log.console.format=%s %e%n
quarkus.log.console.level=TRACE
quarkus.log.console.filter=console-filter

quarkus.log.category."jdk.httpclient".level=INFO
quarkus.log.category."jdk.internal.httpclient.debug".level=WARN
quarkus.log.category."jdk.event.security".level=INFO
quarkus.log.category."java.lang.ProcessBuilder".level=WARN
quarkus.log.category."java.lang.Shutdown".level=WARN
quarkus.log.category."java.lang.Runtime".level=WARN
quarkus.log.category."org.apache.mina.core".level=WARN
quarkus.log.category."org.apache.sshd.client".level=WARN
quarkus.log.category."org.apache.sshd.client.keyverifier".level=ERROR
quarkus.log.category."org.apache.sshd.common".level=WARN
quarkus.log.category."org.apache.sshd.git.transport".level=WARN
quarkus.log.category."org.eclipse.jgit.internal".level=WARN
quarkus.log.category."org.eclipse.jgit.transport".level=INFO
quarkus.log.category."org.eclipse.jgit.util".level=INFO
quarkus.log.category."sun.net.www.protocol.http".level=INFO
quarkus.log.category."com.google.inject".level=WARN
