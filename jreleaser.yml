project:
  name: plugin-modernizer-tool
  description: Plugin Modernizer Tool
  versionPattern: CUSTOM
  longDescription: Plugin Modernizer Tool
  authors:
    - Jenkins Project
  license: MIT
  links:
    homepage: https://github.com/jenkins-infra/plugin-modernizer-tool
  java:
    groupId: io.jenkins.plugin-modernizer
    version: 25
  inceptionYear: 2024

release:
  github:
    enabled: true
    overwrite: false
    skipTag: true
    tagName: "{{projectVersion}}"
    releaseName: "{{projectVersion}}"
    changelog:
      enabled: false
    milestone:
      close: false
    update:
      enabled: true
    uploadAssets: RELEASE

distributions:
  plugin-modernizer:
    active: RELEASE
    type: SINGLE_JAR
    stereotype: CLI
    artifacts:
      - path: "{{distributionName}}-cli/target/jenkins-plugin-modernizer-{{projectVersion}}.jar"
    brew:
      active: NEVER
    scoop:
      active: NEVER

  # Executables built by .github/workflows/native.yml
  plugin-modernizer-native:
    active: RELEASE
    type: FLAT_BINARY
    stereotype: CLI
    executable:
      # Same command as the Nix flake and README
      name: plugin-modernizer
      windowsExtension: exe
    artifacts:
      - path: "native/jenkins-plugin-modernizer-{{projectVersion}}-linux-x86_64"
        platform: linux-x86_64
      - path: "native/jenkins-plugin-modernizer-{{projectVersion}}-linux-aarch_64"
        platform: linux-aarch_64
      - path: "native/jenkins-plugin-modernizer-{{projectVersion}}-osx-aarch_64"
        platform: osx-aarch_64
      - path: "native/jenkins-plugin-modernizer-{{projectVersion}}-windows-x86_64.exe"
        platform: windows-x86_64
    brew:
      active: RELEASE
      formulaName: plugin-modernizer
      multiPlatform: true
    scoop:
      active: RELEASE
      packageName: plugin-modernizer
      # Renames the versioned download to match "bin"
      templateDirectory: scoop

packagers:
  brew:
    active: RELEASE
    formulaName: PluginModernizer
    repository:
      active: RELEASE
      owner: jenkins-infra
      name: homebrew-tap
      tagName: '{{distributionName}}-{{projectVersion}}'
    commitAuthor:
      name: jenkins-infra
      email: jenkins-infra-team@googlegroups.com
    extraProperties:
      skipLicenseFile: true
    skipTemplates:
      - cask.rb.tpl
      - README.md.tpl

  scoop:
    active: RELEASE
    repository:
      active: RELEASE
      owner: jenkins-infra
      name: scoop-bucket
      tagName: '{{distributionName}}-{{projectVersion}}'
    commitAuthor:
      name: jenkins-infra
      email: jenkins-infra-team@googlegroups.com
    extraProperties:
      skipLicenseFile: true
    skipTemplates:
      - scoop-bucket/README.md.tpl
